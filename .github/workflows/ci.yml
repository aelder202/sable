name: CI

on:
  push:
    branches: ["main", "release/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOTOOLCHAIN: local

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@v0.7.0
          staticcheck ./...

      - name: Test
        run: go test ./...

      - name: Race detector
        run: go test -race ./...

      - name: JavaScript syntax and unit tests
        run: |
          for file in web/*.js; do node --check "$file"; done
          node --test web/logic.test.cjs

      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Secret scan
        env:
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks dir --redact --no-banner .

          zero=0000000000000000000000000000000000000000
          range=
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range="$BASE_SHA..$HEAD_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "$zero" ]; then
            range="$BEFORE_SHA..$GITHUB_SHA"
          elif base_sha=$(git merge-base "origin/$DEFAULT_BRANCH" "$GITHUB_SHA"); then
            range="$base_sha..$GITHUB_SHA"
          fi
          if [ -n "$range" ]; then
            gitleaks git --redact --no-banner --log-opts="$range" .
          fi

      - name: Validate OpenAPI
        run: npx --yes @redocly/cli@2.39.0 lint docs/openapi.yaml

      - name: Integration tests
        run: go test -tags integration -v ./...

      - name: Build all commands
        run: go build ./...

      - name: Cross-build Windows commands
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: "0"
        run: go build ./...

  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Windows implementation
        run: go test ./...

      - name: Build Windows commands
        run: go build ./...

      - name: JavaScript syntax and unit tests
        run: |
          node --check web/app.js
          node --test web/logic.test.cjs
