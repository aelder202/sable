openapi: 3.0.3
info:
  title: Sable Operator API
  version: 1.2.0
  description: |
    Loopback-only operator API for the Sable C2 server. Bound to
    `127.0.0.1:8443` by default. All endpoints except `POST /api/auth/login`
    require a Bearer JWT obtained from `/api/auth/login`.

    **Error responses are plain text** (`text/plain; charset=utf-8`), not JSON.
    Each error response below documents the canonical message body emitted by
    the server.

    The TLS certificate is self-signed and pinned by SHA-256 fingerprint when
    operators connect through `sablectl`. Browsers will need to accept the
    certificate manually.
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html

servers:
  - url: https://127.0.0.1:8443
    description: Operator API on the Sable server (loopback)

security:
  - bearerAuth: []

tags:
  - name: Auth
    description: Operator authentication.
  - name: Admin
    description: Local server lifecycle operations.
  - name: Agents
    description: Registered agent sessions and metadata.
  - name: Fleet
    description: Lightweight fleet-wide status and activity summaries.
  - name: Tasks
    description: Queue, list, and clear tasks for an agent.
  - name: Artifacts
    description: Operator-saved artifacts associated with an agent session.
  - name: Audit
    description: Operator and session audit events.
  - name: Terminal
    description: Real-time task output stream (Server-Sent Events).

paths:

  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Exchange operator password for a JWT
      description: |
        Returns a signed HS256 JWT valid for 1 hour. Rate-limited to 5
        attempts per 60 seconds per remote IP; rate-limited responses
        include a `Retry-After` header.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              password: correct-horse-battery-staple
      responses:
        '200':
          description: Authentication succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: Too many login attempts from this IP.
          headers:
            Retry-After:
              schema: { type: integer }
              description: Seconds until another attempt is allowed.
          content:
            text/plain:
              schema: { type: string }
              example: "too many requests\n"

  /api/audit:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      summary: Recent operator and session audit events
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Up to 512 most recent events.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/admin/shutdown:
    post:
      tags: [Admin]
      operationId: shutdownServer
      summary: Gracefully stop the local Sable server
      description: |
        Requests the same graceful shutdown path used for an operating-system
        termination signal. The operator API is loopback-only and this route
        requires a valid operator JWT.
      responses:
        '202':
          description: Shutdown accepted.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503':
          description: The host process did not configure lifecycle control.

  /api/overview:
    get:
      tags: [Fleet]
      operationId: getFleetOverview
      summary: Lightweight fleet status and activity summary
      description: Returns dashboard counters, one summary row per registered agent, bounded task-outcome buckets, and recent semantic activity without output or artifact payloads.
      responses:
        '200':
          description: Current fleet overview.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FleetOverview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/overview/alerts/{alertID}:
    put:
      tags: [Fleet]
      operationId: resolveOverviewFailureAlert
      summary: Resolve a failed-task alert on the Overview dashboard
      description: |
        Acknowledges only the Overview notification. The retained
        agent task output, recent activity, and task-outcome history are not
        changed.
      parameters:
        - name: alertID
          in: path
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{32}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverviewAlertResolutionRequest'
      responses:
        '204':
          description: The Overview alert was resolved.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List registered agents
      description: |
        Returns the full agent list. Each entry omits `outputs` (use
        `GET /api/agents/{id}` to fetch task output history) and never
        includes the agent's pre-shared secret.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Agent list.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

    post:
      tags: [Agents]
      operationId: registerAgent
      summary: Pre-register an agent session
      description: |
        Creates the server-side agent record so an implant built with the
        same `id` and `secret_hex` can begin beaconing. Idempotent: re-registering
        an existing ID preserves notes, tags, queued tasks, outputs, and artifacts.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterAgentRequest' }
      responses:
        '201':
          description: Agent registered.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                required: [id]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/agents/{id}:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    get:
      tags: [Agents]
      operationId: getAgent
      summary: Get a single agent including task output history
      responses:
        '200':
          description: Agent record. Includes `outputs` and `queued`; artifacts list omits `data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      tags: [Agents]
      operationId: revokeAgent
      summary: Revoke an agent and delete its retained server-side state
      responses:
        '204': { description: Agent revoked. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/rekey:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    post:
      tags: [Agents]
      operationId: rekeyAgent
      summary: Generate and install a new 32-byte agent secret
      description: The new secret is returned once and the currently deployed agent must be rebuilt or reconfigured.
      responses:
        '200':
          description: Secret rotated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RekeyAgentResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/metadata:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    put:
      tags: [Agents]
      operationId: updateAgentMetadata
      summary: Update an agent display name, notes, and tags
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMetadataRequest' }
      responses:
        '200':
          description: Updated agent record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/agents/{id}/lifecycle:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    put:
      tags: [Agents]
      operationId: updateAgentLifecycle
      summary: Retire or restore an agent without deleting retained state
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AgentLifecycleRequest' }
      responses:
        '200':
          description: Updated agent record.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Agent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/task:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    post:
      tags: [Tasks]
      operationId: queueTask
      summary: Queue a task for the agent
      description: |
        Enqueues a task. The agent picks it up on its next beacon. Per-type
        payload constraints:

        | Type | Payload |
        |------|---------|
        | `shell` | Required. Command line, no null bytes. Max ~48 KB. |
        | `download`, `complete`, `ls` | Required. Remote path, no null/CR/LF, max 4096 bytes. |
        | `download_archive` | One directory path or `{paths:[...],base:"..."}` for up to 100 selected entries. The agent returns a bounded ZIP artifact. |
        | `pathbrowse` | `start` or `stop`. |
        | `interactive` | `start` or `stop`. |
        | `upload` | `<remote-path>:<base64-data>`. Max payload ~53.4 MiB; raw file max 40 MiB. Cannot be queued for an agent currently using the DNS transport when payload exceeds 8 KiB. |
        | `sleep` | Integer seconds, 1–86400. |
        | `cancel` | Task ID to cancel, max 64 chars. |
        | `kill`, `ps`, `screenshot`, `persistence`, `peas`, `snapshot` | Must be empty. |

        Per-agent queue is capped at 64 pending tasks (`429` once full).
        Retired agents reject new work with `409` until restored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskRequest' }
            examples:
              shell:
                value: { type: shell, payload: id }
              sleep:
                value: { type: sleep, payload: "60" }
              download:
                value: { type: download, payload: /etc/passwd }
              directoryArchive:
                value: { type: download_archive, payload: /var/log }
              upload:
                summary: Upload a file (base64-encoded after the colon)
                value: { type: upload, payload: "/tmp/agent:dGVzdAo=" }
              ps:
                value: { type: ps, payload: "" }
      responses:
        '200':
          description: Task queued.
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string, format: uuid }
                required: [task_id]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '409':
          description: The agent is retired and must be restored before tasking.
          content:
            text/plain:
              schema: { type: string }
              example: "agent is retired\n"
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429':
          description: Queue full (max 64 pending tasks per agent).
          content:
            text/plain:
              schema: { type: string }
              example: "task queue full\n"

  /api/agents/{id}/queued:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    get:
      tags: [Tasks]
      operationId: listQueuedTasks
      summary: List queued tasks not yet delivered to the agent
      responses:
        '200':
          description: Pending task summaries in queue order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/tasks:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    get:
      tags: [Tasks]
      operationId: listTaskOutputs
      summary: Get task output history
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Up to 256 most recent task outputs.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TaskOutput' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      tags: [Tasks]
      operationId: clearTaskOutputs
      summary: Clear task output history for the agent
      responses:
        '204':
          description: History cleared.
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/tasks/{taskID}:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
      - $ref: '#/components/parameters/TaskIdParam'
    delete:
      tags: [Tasks]
      operationId: deleteQueuedTask
      summary: Remove a queued task before delivery
      responses:
        '204':
          description: Task removed from queue.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    get:
      tags: [Artifacts]
      operationId: listArtifacts
      summary: List server-side artifact summaries
      description: Response items omit `data`; fetch a single artifact to retrieve its base64 contents.
      parameters:
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: Artifact summaries (no `data`).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    post:
      tags: [Artifacts]
      operationId: saveArtifact
      summary: Save an operator artifact
      description: |
        Maximum body size is ~75 MB. If `key` is supplied and matches an
        existing artifact for this agent, the existing record is returned
        (idempotent save).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Artifact' }
      responses:
        '201':
          description: Artifact saved (response omits `data`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/agents/{id}/artifacts/{artifactID}:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
      - $ref: '#/components/parameters/ArtifactIdParam'
    get:
      tags: [Artifacts]
      operationId: getArtifact
      summary: Fetch a single artifact including base64 data
      responses:
        '200':
          description: Full artifact including `data`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Artifact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
    delete:
      tags: [Artifacts]
      operationId: deleteArtifact
      summary: Delete a retained artifact and its data blob
      responses:
        '204': { description: Artifact deleted. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/agents/{id}/artifacts/retention:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    put:
      tags: [Artifacts]
      operationId: setArtifactRetention
      summary: Retain only the newest configured number of artifacts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ArtifactRetentionRequest' }
      responses:
        '204': { description: Retention updated and oldest excess artifacts removed. }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '413': { $ref: '#/components/responses/RequestEntityTooLarge' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }

  /api/agents/{id}/terminal/stream:
    parameters:
      - $ref: '#/components/parameters/AgentIdParam'
    get:
      tags: [Terminal]
      operationId: streamTerminal
      summary: Subscribe to task output via Server-Sent Events
      description: |
        Long-lived SSE stream of task outputs. The connection has no server
        write deadline (unlike other endpoints, which apply a 10-second write
        timeout).

        Wire format:

        - Each output event is framed as `data: <json>\n\n`, where `<json>`
          conforms to the `TaskOutput` schema.
        - Comment lines `: keepalive\n\n` are sent every 15 seconds.
        - On connect, the server flushes the existing output history before
          waiting for new events.

        Response headers set: `Content-Type: text/event-stream`,
        `Cache-Control: no-cache`, `X-Accel-Buffering: no`.
      responses:
        '200':
          description: SSE stream open. Closes when the client disconnects.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TaskOutput'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '500':
          description: Streaming not supported by the underlying writer.
          content:
            text/plain:
              schema: { type: string }
              example: "streaming unsupported\n"

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        HS256 JWT issued by `/api/auth/login`. Issuer `sable-operator`,
        audience `sable-web`, subject `operator`, 1-hour TTL.

  parameters:
    LimitParam:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 500 }
      description: Maximum number of collection items to return.
    OffsetParam:
      name: offset
      in: query
      schema: { type: integer, minimum: 0, default: 0 }
      description: Zero-based collection offset. Responses include X-Total-Count, X-Limit, and X-Offset headers.
    AgentIdParam:
      name: id
      in: path
      required: true
      description: Agent identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-]{1,64}$'
        minLength: 1
        maxLength: 64
        example: main
    ArtifactIdParam:
      name: artifactID
      in: path
      required: true
      description: Artifact identifier.
      schema:
        type: string
        pattern: '^[a-zA-Z0-9-]{1,64}$'
        minLength: 1
        maxLength: 64
    TaskIdParam:
      name: taskID
      in: path
      required: true
      description: Queued task identifier (UUID assigned at enqueue time).
      schema:
        type: string
        minLength: 1
        maxLength: 64

  schemas:

    LoginRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          description: Operator password. Request body capped at 4096 bytes.
          example: correct-horse-battery-staple

    LoginResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: Bearer JWT (HS256). Valid for 1 hour.

    RegisterAgentRequest:
      type: object
      required: [id, secret_hex]
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          minLength: 1
          maxLength: 64
          example: main
        secret_hex:
          type: string
          description: 32-byte agent secret encoded as 64 lowercase hex characters.
          pattern: '^[0-9a-fA-F]{64}$'
          minLength: 64
          maxLength: 64
        display_name:
          type: string
          maxLength: 64
          description: Initial operator-facing name, normally seeded from the local build label.

    RekeyAgentResponse:
      type: object
      required: [id, secret_hex]
      properties:
        id: { type: string }
        secret_hex:
          type: string
          pattern: '^[0-9a-f]{64}$'

    ArtifactRetentionRequest:
      type: object
      required: [max_items]
      properties:
        max_items: { type: integer, minimum: 1, maximum: 256 }

    UpdateMetadataRequest:
      type: object
      properties:
        display_name:
          type: string
          maxLength: 64
        notes:
          type: string
          maxLength: 4096
        tags:
          type: array
          maxItems: 32
          items:
            type: string

    AgentLifecycleRequest:
      type: object
      required: [retired]
      properties:
        retired: { type: boolean }

    Agent:
      type: object
      required: [id]
      description: |
        Agent session record. The pre-shared secret is never serialized.
        `outputs` is populated only by `GET /api/agents/{id}` and the
        metadata-update response — list responses omit it. `artifacts` here
        always omits `data`.
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
        display_name: { type: string, maxLength: 64 }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        transport:
          type: string
          enum: [https, dns]
          description: Transport used on the most recent check-in. Empty until first beacon.
        last_ip:
          type: string
          description: Authenticated network source used for the most recent check-in.
        host_ip:
          type: string
          description: Route-selected local address reported by the authenticated agent.
        last_seen:
          type: string
          format: date-time
        registered_at: { type: string, format: date-time }
        first_seen: { type: string, format: date-time }
        expected_next_seen: { type: string, format: date-time }
        sleep_seconds: { type: integer, minimum: 1, maximum: 86400 }
        status:
          type: string
          enum: [never_seen, on_schedule, overdue, offline, retired]
        retired: { type: boolean }
        retired_at: { type: string, format: date-time }
        queued_count: { type: integer, minimum: 0 }
        running_count: { type: integer, minimum: 0 }
        active_transfers: { type: integer, minimum: 0 }
        artifact_count: { type: integer, minimum: 0 }
        last_result_at: { type: string, format: date-time }
        last_result_status:
          type: string
          enum: [success, progress, failed]
        notes: { type: string }
        tags:
          type: array
          items: { type: string }
        queued:
          type: array
          items: { $ref: '#/components/schemas/TaskSummary' }
        outputs:
          type: array
          items: { $ref: '#/components/schemas/TaskOutput' }
        artifacts:
          type: array
          items: { $ref: '#/components/schemas/Artifact' }
        artifact_retention:
          type: integer
          minimum: 1
          maximum: 256

    TaskRequest:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            - shell
            - upload
            - download
            - download_archive
            - sleep
            - kill
            - interactive
            - complete
            - pathbrowse
            - ps
            - screenshot
            - persistence
            - peas
            - snapshot
            - cancel
            - ls
        payload:
          type: string
          description: |
            Per-type rules and limits are listed on the operation. Standard
            payloads are capped at ~48 KB; archive selections at 512 KiB;
            `upload` payloads at ~53.4 MiB (raw file max 40 MiB).

    AgentSummary:
      type: object
      required: [id, status, queued_count, running_count, active_transfers, artifact_count]
      properties:
        id: { type: string }
        display_name: { type: string }
        hostname: { type: string }
        os: { type: string }
        arch: { type: string }
        transport: { type: string, enum: [https, dns] }
        last_ip: { type: string }
        host_ip: { type: string }
        registered_at: { type: string, format: date-time }
        first_seen: { type: string, format: date-time }
        last_seen: { type: string, format: date-time }
        expected_next_seen: { type: string, format: date-time }
        sleep_seconds: { type: integer }
        status: { type: string, enum: [never_seen, on_schedule, overdue, offline, retired] }
        retired: { type: boolean }
        retired_at: { type: string, format: date-time }
        tags: { type: array, items: { type: string } }
        queued_count: { type: integer, minimum: 0 }
        running_count: { type: integer, minimum: 0 }
        active_transfers: { type: integer, minimum: 0 }
        artifact_count: { type: integer, minimum: 0 }
        last_result_at: { type: string, format: date-time }
        last_result_status: { type: string, enum: [success, progress, failed] }

    ActiveJob:
      type: object
      required: [id, agent_id, agent_name, type]
      description: A task that the host has received and has not completed.
      properties:
        id: { type: string }
        agent_id: { type: string }
        agent_name: { type: string }
        type: { type: string }
        payload:
          type: string
          maxLength: 512
          description: Sanitized, display-oriented task payload summary.
        received_at: { type: string, format: date-time }

    FleetOverview:
      type: object
      required: [generated_at, total, never_seen, on_schedule, overdue, offline, retired, queued_tasks, running_tasks, active_jobs, active_transfers, failed_last_24_hours, agents, task_outcomes_24h, task_outcomes_7d, recent_activity, failure_alerts]
      properties:
        generated_at: { type: string, format: date-time }
        total: { type: integer, minimum: 0 }
        never_seen: { type: integer, minimum: 0 }
        on_schedule: { type: integer, minimum: 0 }
        overdue: { type: integer, minimum: 0 }
        offline: { type: integer, minimum: 0 }
        retired: { type: integer, minimum: 0 }
        queued_tasks:
          type: integer
          minimum: 0
          description: Tasks waiting for first delivery to a host.
        running_tasks:
          type: integer
          minimum: 0
          description: Tasks delivered to a host and awaiting a terminal result.
        active_jobs:
          type: array
          items: { $ref: '#/components/schemas/ActiveJob' }
        active_transfers: { type: integer, minimum: 0 }
        failed_last_24_hours: { type: integer, minimum: 0 }
        agents:
          type: array
          items: { $ref: '#/components/schemas/AgentSummary' }
        task_outcomes_24h:
          type: array
          description: Twenty-four hourly buckets, oldest first.
          minItems: 24
          maxItems: 24
          items: { $ref: '#/components/schemas/TaskOutcomeBucket' }
        task_outcomes_7d:
          type: array
          description: Seven daily buckets, oldest first.
          minItems: 7
          maxItems: 7
          items: { $ref: '#/components/schemas/TaskOutcomeBucket' }
        recent_activity:
          type: array
          maxItems: 32
          items: { $ref: '#/components/schemas/FleetActivityEvent' }
        failure_alerts:
          type: array
          maxItems: 64
          description: Unresolved failed-task notifications from the last 24 hours.
          items: { $ref: '#/components/schemas/FailureAlert' }

    OverviewAlertResolutionRequest:
      type: object
      required: [disposition]
      additionalProperties: false
      properties:
        disposition:
          type: string
          enum: [acknowledged]

    FailureAlert:
      type: object
      required: [id, timestamp, agent_id, agent_name, task_id]
      properties:
        id:
          type: string
          pattern: '^[a-f0-9]{32}$'
        timestamp: { type: string, format: date-time }
        agent_id: { type: string }
        agent_name: { type: string }
        task_id: { type: string }
        task_type: { type: string }
        detail: { type: string }

    TaskOutcomeBucket:
      type: object
      required: [start, successful, failed]
      properties:
        start: { type: string, format: date-time }
        successful: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }

    FleetActivityEvent:
      type: object
      required: [timestamp, agent_id, agent_name, kind]
      properties:
        timestamp: { type: string, format: date-time }
        agent_id: { type: string }
        agent_name: { type: string }
        kind:
          type: string
          enum: [task_success, task_failed, artifact_received, agent_overdue, agent_offline]
        task_type: { type: string }
        detail: { type: string }

    TaskSummary:
      type: object
      required: [id, type, status, queued_at]
      properties:
        id: { type: string }
        type: { type: string }
        status:
          type: string
          enum: [queued, in_flight]
        delivery_attempts: { type: integer, minimum: 0 }
        last_delivered_at: { type: string, format: date-time }
        payload:
          type: string
          description: |
            Summary payload. For `upload` tasks the base64 portion is replaced
            with the literal string `<base64>` so it can be displayed safely.
        queued_at:
          type: string
          format: date-time

    TaskOutput:
      type: object
      required: [task_id, type, output, timestamp]
      properties:
        task_id: { type: string }
        type: { type: string }
        payload:
          type: string
          description: Sanitized task payload retained for operator-facing command labels.
        output: { type: string }
        error: { type: string }
        queued_at: { type: string, format: date-time }
        last_delivered_at:
          type: string
          format: date-time
          description: Last server-to-agent delivery time used to calculate response duration.
        timestamp:
          type: string
          format: date-time

    Artifact:
      type: object
      required: [filename]
      description: |
        Artifact record. The same shape is used for both list and detail
        responses; `data` is only populated when fetching a single artifact
        by ID. On save (`POST`), supply `filename` plus base64 `data`; the
        response omits `data`.
      properties:
        id:
          type: string
          pattern: '^[a-zA-Z0-9-]{1,64}$'
          description: Server-assigned UUID if omitted on create.
        key:
          type: string
          maxLength: 256
          description: Optional dedup key. If a saved artifact already exists with this key, that artifact is returned unchanged.
        task_id: { type: string }
        type: { type: string }
        label:
          type: string
          maxLength: 128
        filename:
          type: string
          minLength: 1
          maxLength: 240
        archive_filename:
          type: string
          maxLength: 240
        mime:
          type: string
          maxLength: 128
        data:
          type: string
          format: byte
          description: Base64-encoded artifact contents. Omitted from list and create responses; present on single-artifact GET.
        size_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Decoded artifact size when known.
        compress: { type: boolean }
        created_at:
          type: string
          format: date-time

    AuditEvent:
      type: object
      required: [timestamp, action]
      properties:
        timestamp:
          type: string
          format: date-time
        agent_id:
          type: string
          description: Empty for events that aren't tied to a specific agent.
        action:
          type: string
          example: queue_task
        detail:
          type: string

  responses:

    BadRequest:
      description: Malformed request, validation failure, or invalid task type.
      content:
        text/plain:
          schema: { type: string }
          example: "bad request\n"

    Unauthorized:
      description: Missing or invalid Bearer token.
      content:
        text/plain:
          schema: { type: string }
          example: "unauthorized\n"

    NotFound:
      description: Agent, task, or artifact does not exist.
      content:
        text/plain:
          schema: { type: string }
          example: "404 page not found\n"

    MethodNotAllowed:
      description: Method not supported on this path.
      content:
        text/plain:
          schema: { type: string }
          example: "method not allowed\n"

    RequestEntityTooLarge:
      description: Request body exceeded the per-endpoint byte cap.
      content:
        text/plain:
          schema: { type: string }
          example: "request body too large\n"

    UnsupportedMediaType:
      description: Body Content-Type is not `application/json`.
      content:
        text/plain:
          schema: { type: string }
          example: "content type must be application/json\n"
